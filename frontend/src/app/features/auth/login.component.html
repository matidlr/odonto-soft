<div class="login-page">
  <form class="login-card" (ngSubmit)="onSubmit()" #form="ngForm">
    <h1>Odonto SaaS</h1>
    <p class="subtitulo">Iniciá sesión</p>

    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="email"
      required
      autocomplete="email"
    />

    <label for="password">Contraseña</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      required
      autocomplete="current-password"
    />

    @if (mensajeInactividad()) {
      <p class="aviso">Se cerró tu sesión por inactividad. Volvé a iniciar sesión.</p>
    }

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>

    @if (mostrarBotonGoogle) {
      <div class="separador-o">o</div>
      <div #googleBotonContainer class="google-boton"></div>
    }

    <p class="link-registro">
      <a routerLink="/olvide-password">¿Olvidaste tu contraseña?</a>
    </p>

    <p class="link-registro">
      ¿No tenés cuenta? <a routerLink="/registro">Registrá tu clínica</a>
    </p>
  </form>
</div>
