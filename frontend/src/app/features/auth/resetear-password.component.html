<div class="login-page">
  @if (listo()) {
    <div class="login-card">
      <h1>Odonto SaaS</h1>
      <p class="subtitulo">¡Listo!</p>
      <p>Tu contraseña se actualizó correctamente.</p>
      <button type="button" (click)="irALogin()">Iniciar sesión</button>
    </div>
  } @else {
    <form class="login-card" (ngSubmit)="onSubmit()" #form="ngForm">
      <h1>Odonto SaaS</h1>
      <p class="subtitulo">Elegí una nueva contraseña</p>

      <label for="password">Nueva contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        minlength="8"
        autocomplete="new-password"
      />

      <label for="confirmarPassword">Repetir contraseña</label>
      <input
        id="confirmarPassword"
        name="confirmarPassword"
        type="password"
        [(ngModel)]="confirmarPassword"
        required
        autocomplete="new-password"
      />

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button type="submit" [disabled]="form.invalid || cargando() || !token">
        {{ cargando() ? 'Guardando...' : 'Guardar nueva contraseña' }}
      </button>

      <p class="link-registro">
        <a routerLink="/olvide-password">Pedir un enlace nuevo</a>
      </p>
    </form>
  }
</div>
