services:
  api:
    build:
      context: ./backend
      dockerfile: src/Odonto.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__Default=Server=db;Port=3306;Database=odonto;User=odonto;Password=odonto_dev_password
      - Jwt__Key=${JWT_KEY:-CHANGE_ME_super_secret_key_min_32_chars_prod}
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db

  db:
    image: mysql:8.4
    environment:
      - MYSQL_DATABASE=odonto
      - MYSQL_USER=odonto
      - MYSQL_PASSWORD=odonto_dev_password
      - MYSQL_ROOT_PASSWORD=odonto_root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
