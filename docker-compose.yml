services:
  api:
    build:
      context: ./backend
      dockerfile: src/Odonto.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__Default=Host=db;Port=5432;Database=odonto;Username=odonto;Password=odonto_dev_password
      - Jwt__Key=${JWT_KEY:-CHANGE_ME_super_secret_key_min_32_chars_prod}
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=odonto
      - POSTGRES_USER=odonto
      - POSTGRES_PASSWORD=odonto_dev_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
